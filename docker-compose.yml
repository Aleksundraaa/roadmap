services:
  backend:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/roadmap.db"
      Jwt__Key: "${JWT_SECRET:-SuperSecretPassword_VeryLongKey_1234567890!}"
      Jwt__Issuer: "RoadMapApi"
      Jwt__Audience: "RoadMapClient"
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
      HTTPS_PROXY: "socks5://host.docker.internal:1080"
      HTTP_PROXY: "socks5://host.docker.internal:1080"
      NO_PROXY: "localhost,127.0.0.1,backend,nginx"
    volumes:
      - db_data:/app/data
      - uploads_data:/app/wwwroot/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
