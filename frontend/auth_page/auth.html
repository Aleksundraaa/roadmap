<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadMap | Авторизация</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-style.css">
    <link rel="stylesheet" href="../utils.css">
</head>
<body class="auth-page">

<div class="main-wrapper">
    <div class="theme-switch-wrapper">
        <em class="theme-text-dark">Светлая</em>
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox"/>
            <div class="slider round"></div>
        </label>
        <em class="theme-text-light">Тёмная</em>
    </div>

    <div class="auth-card">
        <header>
            <h1 class="gradient-text">RoadMap</h1>
        </header>
        <h2 id="auth-title">Вход</h2>
        <p class="subtitle" style="margin-bottom: 20px;">Добро пожаловать</p>

        <div class="auth-form">
            <input type="text" id="username" placeholder="Логин" class="auth-input">

            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Пароль" class="auth-input">
                <span id="togglePassword" class="password-toggle">Показать пароль</span>
            </div>

            <button id="btnAuth" class="btn-primary" onclick="handleAuth()">Войти</button>
            <p class="auth-toggle" onclick="toggleAuthMode()" id="toggle-text">
                Нет аккаунта? Зарегистрироваться
            </p>
        </div>
    </div>
</div>

<script src="../utils.js"></script>
<script src="auth-logic.js"></script>
</body>
</html>
