<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadMap | Авторизация</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth-style.css"> </head>
<body class="auth-page">
<div class="main-wrapper">
    <div class="auth-card">
        <h1 class="gradient-text" style="font-size: 2rem; margin-bottom: 10px;">RoadMap</h1>
        <h2 id="auth-title">Вход</h2>
        <p class="subtitle" style="margin-bottom: 20px;">Добро пожаловать</p>

        <div class="auth-form">
            <input type="text" id="username" placeholder="Логин" class="auth-input">
            <input type="password" id="password" placeholder="Пароль" class="auth-input">
            <button id="btnAuth" class="btn-primary" onclick="handleAuth()">Войти</button>

            <p class="auth-toggle" onclick="toggleAuthMode()" id="toggle-text">
                Нет аккаунта? Зарегистрироваться
            </p>
        </div>
    </div>
</div>
<script src="auth-logic.js"></script>
<script>
    // Код для автоматического применения темы из localStorage
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
</script>
</body>
</html>
